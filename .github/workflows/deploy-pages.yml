name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify Firebase Functions
        working-directory: functions
        run: |
          npm ci
          npm run test:all
          npm run check
      - name: Prepare public artifact
        run: |
          mkdir -p dist/src
          cp index.html admin.html dist/
          cp src/app.js src/history.mjs src/chart-viewport.mjs src/public-status.mjs src/styles.css src/admin.js src/admin.css src/firebase.js dist/src/
          test -e dist/src/public-status.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
