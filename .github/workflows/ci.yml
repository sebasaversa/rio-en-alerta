name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify Firebase Functions
        working-directory: functions
        run: |
          npm ci
          npm run test:all
          npm run check
      - name: Verify public artifact contents
        run: |
          mkdir -p dist/src
          cp index.html admin.html dist/
          cp src/app.js src/history.mjs src/chart-viewport.mjs src/styles.css src/admin.js src/admin.css src/firebase.js dist/src/
          test -e dist/src/chart-viewport.mjs
          test "$(find dist -type f | wc -l | tr -d ' ')" = "9"
          test ! -e dist/functions
          test ! -e dist/firestore.rules
